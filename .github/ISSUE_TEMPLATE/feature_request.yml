name: 功能建议
description: 想要的新功能或改进
labels: [enhancement]
body:
  - type: input
    id: surface
    attributes:
      label: 针对哪一端
      placeholder: "手机端 / 手表端 / 两端"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的不便
      description: 先说场景和痛点，再说方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法（可选）
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案（可选）
      description: 例如用桌面小组件 / Smartspacer / 表盘复杂功能 已有的方式临时解决
    validations:
      required: false
