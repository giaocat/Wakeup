name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        run: |
          set -e
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          # compileSdk 37：36 之后官方改成 minor 版本线（android-37.0 / 37.1 / 37.2），
          # 这里装 37.0，与本地 / gradle 脚本里声明的平台保持一致
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      # 标签与代码里声明的版本必须一致：否则会发布出"标签 v1.0.9、APK 里是 1.0.8"的包。
      # 版本号单点定义在 gradle/libs.versions.toml 的 appVersionName。
      - name: Check tag matches the declared version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          DECLARED="$(grep -E '^appVersionName' gradle/libs.versions.toml | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "tag=v${TAG_VERSION} declared=${DECLARED}"
          if [ -z "${DECLARED}" ]; then
            echo "::error::gradle/libs.versions.toml 里找不到 appVersionName"
            exit 1
          fi
          if [ "${TAG_VERSION}" != "${DECLARED}" ]; then
            echo "::error::标签 v${TAG_VERSION} 与 libs.versions.toml 的 appVersionName=${DECLARED} 不一致"
            exit 1
          fi

      # 固定发布密钥：保证每次构建签出来的证书一致，用户才能覆盖安装。
      # 四个 Secret 缺失时构建会直接失败（见 app/build.gradle.kts），不会静默用调试密钥。
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::缺少 Secret KEYSTORE_BASE64；请按 README「发布与签名」配置"
            exit 1
          fi
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.jks"
          echo "KEYSTORE_FILE=${RUNNER_TEMP}/release.jks" >> "$GITHUB_ENV"
          echo "已写入 keystore：$(stat -c%s "${RUNNER_TEMP}/release.jks") bytes"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # -PrequireSigning=true：本次构建必须用固定密钥，缺了直接失败
        run: ./gradlew assembleRelease -PrequireSigning=true --stacktrace

      # 打印签名证书指纹：这是验证「签名是否稳定」的依据 ——
      # 同一个 keystore 每次构建的指纹必须完全相同。
      # 手机端与手表端两个 APK 都要查：它们用同一个 keystore，指纹也必须一致。
      - name: Report signing certificate
        run: |
          set -e
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort | tail -n 1)"
          echo "### 签名证书 SHA-256" >> "$GITHUB_STEP_SUMMARY"
          for MODULE in app wear; do
            APK="$(find "${MODULE}/build/outputs/apk/release" -name '*.apk' | head -n 1)"
            if [ -z "${APK}" ]; then
              echo "::error::${MODULE} 没有产出 release APK"
              exit 1
            fi
            echo "APK: ${APK}"
            if echo "${APK}" | grep -q 'unsigned'; then
              echo "::error::${MODULE} 产出了未签名 APK，签名配置未生效"
              exit 1
            fi
            "$APKSIGNER" verify --print-certs "${APK}" | tee "/tmp/certs-${MODULE}.txt"
            echo "---"
            DIGEST="$(grep -i 'SHA-256 digest' "/tmp/certs-${MODULE}.txt" | head -n 1)"
            echo "${MODULE} 签名证书：${DIGEST}"
            echo "\`${MODULE}\`" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat "/tmp/certs-${MODULE}.txt" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      # 两个端各自一个 APK：文件名字带 phone / wear，用户不会下错。
      - name: Collect APKs
        run: |
          set -e
          mkdir -p dist
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev"
          fi
          PHONE="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          WEAR="$(find wear/build/outputs/apk/release -name '*.apk' | head -n 1)"
          [ -n "$PHONE" ] || { echo "::error::没有找到手机端 APK"; exit 1; }
          [ -n "$WEAR" ] || { echo "::error::没有找到手表端 APK"; exit 1; }
          cp "$PHONE" "dist/wakeup-phone-${VERSION}.apk"
          cp "$WEAR" "dist/wakeup-wear-${VERSION}.apk"
          ls -lh dist/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: dist/*.apk
          if-no-files-found: error

      # 发布说明来自 CHANGELOG.md 里对应版本的段落（`## X.Y.Z`，不带 v）。
      # **找不到就直接失败**：发布说明是这个项目唯一的用户向变更记录，
      # 缺了它就不该发版（以前的兜底"退回自动提交列表"等于默认允许漏写）。
      - name: Extract changelog
        id: changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          OUT="${RUNNER_TEMP}/release-notes.md"
          : > "$OUT"
          awk -v ver="$VERSION" '
            $0 ~ "^##[[:space:]]+" ver "([[:space:]]|$)" { found=1; next }
            found && /^##[[:space:]]/ { exit }
            found { print }
          ' CHANGELOG.md > "$OUT"
          if [ -s "$OUT" ]; then
            echo "path=$OUT" >> "$GITHUB_OUTPUT"
            echo "已找到 CHANGELOG.md 中 $VERSION 的条目："
            cat "$OUT"
          else
            echo "::error::CHANGELOG.md 里没有 $VERSION 的段落；发版前必须先写好更新日志"
            exit 1
          fi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          body_path: ${{ steps.changelog.outputs.path }}
          generate_release_notes: false
          draft: false
