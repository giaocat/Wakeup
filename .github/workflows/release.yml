name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        run: |
          set -e
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      # 固定发布密钥：保证每次构建签出来的证书一致，用户才能覆盖安装。
      # 四个 Secret 缺失时构建会直接失败（见 app/build.gradle.kts），不会静默用调试密钥。
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::缺少 Secret KEYSTORE_BASE64；请按 README「发布与签名」配置"
            exit 1
          fi
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.jks"
          echo "KEYSTORE_FILE=${RUNNER_TEMP}/release.jks" >> "$GITHUB_ENV"
          echo "已写入 keystore：$(stat -c%s "${RUNNER_TEMP}/release.jks") bytes"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # -PrequireSigning=true：本次构建必须用固定密钥，缺了直接失败
        run: ./gradlew assembleRelease -PrequireSigning=true --stacktrace

      # 打印签名证书指纹：这是验证「签名是否稳定」的依据 ——
      # 同一个 keystore 每次构建的指纹必须完全相同。
      # 手机端与手表端两个 APK 都要查：它们用同一个 keystore，指纹也必须一致。
      - name: Report signing certificate
        run: |
          set -e
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort | tail -n 1)"
          echo "### 签名证书 SHA-256" >> "$GITHUB_STEP_SUMMARY"
          for MODULE in app wear; do
            APK="$(find "${MODULE}/build/outputs/apk/release" -name '*.apk' | head -n 1)"
            if [ -z "${APK}" ]; then
              echo "::error::${MODULE} 没有产出 release APK"
              exit 1
            fi
            echo "APK: ${APK}"
            if echo "${APK}" | grep -q 'unsigned'; then
              echo "::error::${MODULE} 产出了未签名 APK，签名配置未生效"
              exit 1
            fi
            "$APKSIGNER" verify --print-certs "${APK}" | tee "/tmp/certs-${MODULE}.txt"
            echo "---"
            DIGEST="$(grep -i 'SHA-256 digest' "/tmp/certs-${MODULE}.txt" | head -n 1)"
            echo "${MODULE} 签名证书：${DIGEST}"
            echo "\`${MODULE}\`" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat "/tmp/certs-${MODULE}.txt" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      # 两个端各自一个 APK：文件名字带 phone / wear，用户不会下错。
      - name: Collect APKs
        run: |
          set -e
          mkdir -p dist
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev"
          fi
          PHONE="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          WEAR="$(find wear/build/outputs/apk/release -name '*.apk' | head -n 1)"
          [ -n "$PHONE" ] || { echo "::error::没有找到手机端 APK"; exit 1; }
          [ -n "$WEAR" ] || { echo "::error::没有找到手表端 APK"; exit 1; }
          cp "$PHONE" "dist/wakeup-phone-${VERSION}.apk"
          cp "$WEAR" "dist/wakeup-wear-${VERSION}.apk"
          ls -lh dist/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: dist/*.apk
          if-no-files-found: error

      # 发布说明来自 CHANGELOG.md 里对应版本的段落（`## X.Y.Z`，不带 v）。
      # 这样每次 release 都有手写好的更新日志，而不是提交标题堆砌。
      - name: Extract changelog
        id: changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          OUT="${RUNNER_TEMP}/release-notes.md"
          : > "$OUT"
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VERSION" '
              $0 ~ "^##[[:space:]]+" ver "([[:space:]]|$)" { found=1; next }
              found && /^##[[:space:]]/ { exit }
              found { print }
            ' CHANGELOG.md > "$OUT"
          fi
          if [ -s "$OUT" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "path=$OUT" >> "$GITHUB_OUTPUT"
            echo "已找到 CHANGELOG.md 中 $VERSION 的条目："
            cat "$OUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CHANGELOG.md 里没有 $VERSION 的条目，将退回自动生成的提交列表"
          fi

      - name: Publish GitHub Release (使用 CHANGELOG)
        if: startsWith(github.ref, 'refs/tags/v') && steps.changelog.outputs.found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          body_path: ${{ steps.changelog.outputs.path }}
          generate_release_notes: false
          draft: false

      # 兜底：没写 CHANGELOG 段落时不要让发布失败，退回自动生成的提交列表
      - name: Publish GitHub Release (自动生成的提交列表)
        if: startsWith(github.ref, 'refs/tags/v') && steps.changelog.outputs.found != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          draft: false
