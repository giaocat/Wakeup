[versions]
agp = "9.4.1"
kotlin = "2.2.10"
# 以下版本全部控制在 minCompileSdk <= 36：
# 公开 SDK 仓库最高只提供 platforms;android-36，android-37 仍是 preview 频道，
# CI 上无法通过 sdkmanager 安装，所以 compileSdk 固定 36、依赖也要匹配。
coreKtx = "1.18.0"
# 2.11.0 的 lifecycle-*-compose 要求 compileSdk 37，2.10.0 是 35
lifecycle = "2.10.0"
activityCompose = "1.13.0"
composeBom = "2026.06.01"
# 1.5.0-alpha01 是仍带 Material 3 Expressive API（MaterialExpressiveTheme /
# MotionScheme / MaterialShapes / LoadingIndicator）且 minCompileSdk=35 的最后几个版本；
# alpha29 起 minCompileSdk 变为 37。
material3 = "1.5.0-alpha01"
material3Adaptive = "1.4.0-alpha03"
navigation = "2.9.8"
datastore = "1.2.1"
retrofit = "3.0.0"
okhttp = "5.2.1"
kotlinxSerialization = "1.9.0"
kotlinxCoroutines = "1.10.2"
# Smartspacer 插件 SDK（Apache 2.0）。1.1 是 Maven Central 上 sdk-plugin 的最新版。
# 注意：SDK 的 AAR 声明 minSdk 29，而本项目 minSdk 26，
# 所以 AndroidManifest.xml 里用 tools:overrideLibrary 覆盖（那里有详细说明）。
# AAR 的 minCompileSdk=1，不限制我们锁定的 compileSdk 36。
smartspacer = "1.1"
# Wear OS 版（:wear）用的是 Compose for Wear OS 3。
# 1.7.x 的 aar-metadata 里 minCompileSdk=37，而我们锁死 compileSdk 36
# （公开 SDK 仓库没有 android-37），所以停在 1.6.2（minCompileSdk=35）。
wearCompose = "1.6.2"
# 手表端与手机端之间的课表同步（Wearable Data Layer）。
# 不直接读 Android SDK 的 java.time：手机端 minSdk 已经压到 24，
# java.time 靠 core library desugaring 提供。
playServicesWearable = "19.0.0"
desugarJdkLibs = "2.1.5"
# 手表端「表盘小组件」：表盘复杂功能（Complication）与信息块（Tile）。
# 版本都挑 minCompileSdk <= 36 的：complications 1.3.0(34) / tiles 1.6.2(35) / protolayout 1.4.2(34)
wearWatchfaceComplications = "1.3.0"
wearTiles = "1.6.2"
wearProtolayout = "1.4.2"
# 手机端大屏 / 折叠屏适配：窗口尺寸类 + 折叠状态（FoldingFeature）。minCompileSdk=34
androidxWindow = "1.5.1"
junit = "4.13.2"
androidxJunit = "1.3.0"
espresso = "3.7.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Compose
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version = "1.7.8" }
# 手表端只用基础图标集（Settings / Refresh / ArrowBack 等），不需要 extended
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core", version = "1.7.8" }

# Material 3 Expressive (M3E) -- pinned ahead of the BOM so the expressive APIs are available
m3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
m3-adaptive-core = { group = "androidx.compose.material3.adaptive", name = "adaptive", version.ref = "material3Adaptive" }
m3-sizing = { group = "androidx.compose.material3", name = "material3-window-size-class", version.ref = "material3" }

# Network
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-scalars = { group = "com.squareup.retrofit2", name = "converter-scalars", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }

# Smartspacer（桌面「一览」小组件）插件 SDK：把「下一节课」作为 Target 暴露出去
smartspacer-sdk-plugin = { group = "com.kieronquinn.smartspacer", name = "sdk-plugin", version.ref = "smartspacer" }

# Compose for Wear OS：手表端的 Material 3 组件（:wear 用）
wear-compose-material3 = { group = "androidx.wear.compose", name = "compose-material3", version.ref = "wearCompose" }
wear-compose-foundation = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "wearCompose" }

# 手机 ↔ 手表同步（Wearable Data Layer，GMS）
play-services-wearable = { group = "com.google.android.gms", name = "play-services-wearable", version.ref = "playServicesWearable" }

# core library desugaring：把 java.time 等 API 下放到更低 minSdk
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }

# 表盘复杂功能（Complication）：把「下一节课」显示在系统表盘上
wear-watchface-complications-data-source-ktx = { group = "androidx.wear.watchface", name = "watchface-complications-data-source-ktx", version.ref = "wearWatchfaceComplications" }
# 信息块（Tile）：从表盘往左滑就能看到今天/下一节课
wear-tiles = { group = "androidx.wear.tiles", name = "tiles", version.ref = "wearTiles" }
wear-protolayout = { group = "androidx.wear.protolayout", name = "protolayout", version.ref = "wearProtolayout" }

# 大屏 / 折叠屏：窗口尺寸类 + 折叠姿态
androidx-window = { group = "androidx.window", name = "window", version.ref = "androidxWindow" }

# Test
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
